<!DOCTYPE html>
<html>

<head>
    {% load static %}
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <link href="https://fonts.googleapis.com/css?family=Roboto:300,400&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="{% static 'login/fonts/icomoon/style.css' %}">

    <link rel="stylesheet" href="{% static 'login/css/owl.carousel.min.css' %}">

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="{% static 'login/css/bootstrap.min.css' %}">

    <!-- Style -->
    <link rel="stylesheet" href="{% static 'login/css/style.css' %}">

    <title>Créer un compte</title>
</head>

<body>
    <div class="d-lg-flex half">
        <div class="bg order-1 order-md-2" style="background-image: url({% static 'login/bg_1.jpg' %});"></div>
        <div class="contents order-2 order-md-1">

            <div class="container">
                <div class="row align-items-center justify-content-center">
                    <div class="col-md-7">
                        <div class="mb-4">
                            <h3>Bonjour !</h3>
                            <p class="mb-4">Créez votre compte ci-dessous :</p>
                        </div>

                        <form method="post">
                            {% csrf_token %}
                            <div class="form-group first">
                                <label for="username">Nom d'utilisateur</label>
                                <input type="text" name="username" maxlength="150" autofocus autocapitalize="none"
                                    autocomplete="username" required id="id_username" class="form-control">

                            </div>
                            <div class="form-group first">
                                <label for="first_name">Prénom</label>
                                <input type="text" name="first_name" maxlength="150" id="id_first_name"
                                    class="form-control" required>

                            </div>
                            <div class="form-group first">
                                <label for="last_name">Nom</label>
                                <input type="text" name="last_name" maxlength="150" id="id_last_name"
                                    class="form-control" required>

                            </div>
                            <div class="form-group first">
                                <label for="email">Adresse email</label>
                                <input type="email" name="email" maxlength="254" id="id_email" class="form-control"
                                    required>

                            </div>
                            <div class="form-group last mb-3">
                                <label for="password">Mot de passe</label>
                                <input type="password" name="password1" autocomplete="new-password" required
                                    id="id_password" class="form-control">

                            </div>
                            <div class="form-group last mb-3">
                                <label for="password">Mot de passe (vérification)</label>
                                <input type="password" name="password2" autocomplete="new-password" required
                                    id="id_password" class="form-control">

                            </div>

                            <input type="submit" value="Créer un compte" class="btn btn-block btn-primary" />
                        </form>
                    </div>
                </div>
            </div>
        </div>


    </div>
    <a href="{% url 'login' %}">Back to Login</a>
    <script src="{% static 'login/js/jquery-3.3.1.min.js' %}"></script>
    <script src="{% static 'login/js/popper.min.js' %}"></script>
    <script src="{% static 'login/js/bootstrap.min.js' %}"></script>
    <script src="{% static 'login/js/main.js' %}"></script>
</body>

</html>
